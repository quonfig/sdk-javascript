name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.9.0", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sdk-javascript

      # test/duration.test.js and test/itd-getter-contract.test.js read shared
      # fixtures (the duration grammar, the typed-getter matrix)
      # (tests/duration/grammar.yaml) from a sibling integration-test-data
      # checkout, the same layout as the monorepo. Pinned to a tag (not main)
      # so a typo in shared YAML can't break every SDK's CI at once; it must
      # be a tag that contains tests/duration/grammar.yaml and the getter.contract
      # matrix that test/itd-getter-contract.test.js reads (v2026.10.23+).
      # See integration-test-data/RELEASING.md.
      - name: Checkout integration-test-data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quonfig/integration-test-data
          path: integration-test-data
          ref: v2026.10.23

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: sdk-javascript/package-lock.json

      - name: Install
        working-directory: sdk-javascript
        run: npm ci

      - name: Build
        working-directory: sdk-javascript
        run: npm run build

      - name: Run formatter
        working-directory: sdk-javascript
        run: npm run prettier

      - name: Test
        working-directory: sdk-javascript
        run: npm test
